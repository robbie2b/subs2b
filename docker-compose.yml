services:
  subs2b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subs2b
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
      - HOST=0.0.0.0
      - BASE_URL=http://localhost:7000
      # Optional: PostgreSQL connection string. Without it, configurations are stored in ./data
      - DATABASE_URL=${DATABASE_URL:-}
      - RATE_LIMIT_MAX=150
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
